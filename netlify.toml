[build]
publish = "dist"
command = "NODE_OPTIONS=--max_old_space_size=4096 pnpm run build"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "https://antfu.dev/*"
to = "https://antfu.me/:splat"
status = 302
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
